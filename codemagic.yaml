workflows:
  loggerhead-ios:
    name: Loggerhead iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-capacitor
          include: true

    integrations:
      app_store_connect: Loggerhead ASC Key

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.loggerheadstat.app
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.loggerheadstat.app"
        REACT_APP_API_URL: "https://api.loggerhead.app"
        APP_VERSION: "2.1.3"
      node: v22.0.0

    scripts:
      - name: Install npm dependencies
        script: |
          cd $CM_BUILD_DIR
          npm install

      - name: Build React app
        script: |
          cd $CM_BUILD_DIR
          REACT_APP_API_URL=$REACT_APP_API_URL npm run build

      - name: Add iOS platform
        script: |
          cd $CM_BUILD_DIR
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Copy web assets to iOS
        script: |
          cd $CM_BUILD_DIR
          npx cap copy ios

      - name: Enable In-App Purchase capability
        script: |
          PROJ=$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj
          ENTITLEMENTS=$CM_BUILD_DIR/ios/App/App/App.entitlements

          # Create entitlements file if it doesn't exist
          if [ ! -f "$ENTITLEMENTS" ]; then
            /usr/libexec/PlistBuddy -c "Clear dict" "$ENTITLEMENTS"
            echo "✅ Created App.entitlements"
          fi

          # StoreKit (In-App Purchase) does not require a special entitlement key —
          # it is enabled automatically for App Store distribution profiles.
          # However we wire up the entitlements file so Xcode picks it up for dev signing.
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.in-app-payments array" "$ENTITLEMENTS" 2>/dev/null || true

          # Point the Xcode target at our entitlements file
          sed -i '' 's|CODE_SIGN_ENTITLEMENTS = .*|CODE_SIGN_ENTITLEMENTS = App/App.entitlements;|g' "$PROJ" 2>/dev/null || true

          echo "✅ In-App Purchase capability enabled"

      - name: Enable push notifications (iOS)
        script: |
          # ios/ is recreated every build, so push setup has to be re-applied here.
          # Needs firebase/GoogleService-Info.plist in the repo and Push Notifications
          # enabled on the App ID in the Apple Developer portal.
          APP_DIR=$CM_BUILD_DIR/ios/App/App
          PROJ=$CM_BUILD_DIR/ios/App/App.xcodeproj
          ENTITLEMENTS=$APP_DIR/App.entitlements
          PLIST=$APP_DIR/Info.plist

          # Push entitlement — "production" for TestFlight / App Store builds.
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENTITLEMENTS" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENTITLEMENTS"

          # Allow notification delivery while the app is in the background.
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" 2>/dev/null | grep -q remote-notification; then
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" "$PLIST"
          fi

          # Firebase config, added to the App target's bundle resources.
          if [ -f "$CM_BUILD_DIR/firebase/GoogleService-Info.plist" ]; then
            cp "$CM_BUILD_DIR/firebase/GoogleService-Info.plist" "$APP_DIR/"
            gem list -i xcodeproj >/dev/null 2>&1 || gem install xcodeproj --no-document
            ruby -e '
              require "xcodeproj"
              proj = Xcodeproj::Project.open(ARGV[0])
              target = proj.targets.find { |t| t.name == "App" }
              group = proj.main_group.find_subpath("App", false)
              unless group.files.any? { |f| f.path == "GoogleService-Info.plist" }
                ref = group.new_reference("GoogleService-Info.plist")
                target.resources_build_phase.add_file_reference(ref, true)
              end
              proj.save
            ' "$PROJ"
            echo "✅ GoogleService-Info.plist added"
          else
            # The Firebase plugin configures Firebase at launch; without this file the app crashes.
            echo "❌ firebase/GoogleService-Info.plist is missing — add it before building (see firebase/README.md)"
            exit 1
          fi

          # AppDelegate hooks the Firebase messaging plugin needs.
          python3 - "$APP_DIR/AppDelegate.swift" << 'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          if "capacitorDidRegisterForRemoteNotifications" not in src:
              hooks = '''
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }

              func application(_ application: UIApplication, didReceiveRemoteNotification userInfo: [AnyHashable: Any], fetchCompletionHandler completionHandler: @escaping (UIBackgroundFetchResult) -> Void) {
                  NotificationCenter.default.post(name: Notification.Name.init("didReceiveRemoteNotification"), object: completionHandler, userInfo: userInfo)
              }
          '''
              end = src.rstrip().rfind("}")
              src = src[:end] + hooks + "\n}\n"
              open(path, "w").write(src)
          PY
          grep -q capacitorDidRegisterForRemoteNotifications "$APP_DIR/AppDelegate.swift" && echo "✅ AppDelegate push hooks added"
          echo "✅ Push notifications enabled (iOS)"

      - name: Add iOS permissions to Info.plist
        script: |
          PLIST=$CM_BUILD_DIR/ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Loggerhead uses your microphone for voice-activated stat logging'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Loggerhead uses speech recognition to log volleyball stats hands-free'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || true
          echo "✅ iOS permissions added to Info.plist"

      - name: Inject app icons and splash screen
        script: |
          ICONS_SRC=$CM_BUILD_DIR/ios-assets/AppIcons
          ICONS_DEST=$CM_BUILD_DIR/ios/App/App/Assets.xcassets/AppIcon.appiconset
          SPLASH_SRC=$CM_BUILD_DIR/ios-assets/SplashScreen/splash.png
          SPLASH_DEST_DIR=$CM_BUILD_DIR/ios/App/App/Assets.xcassets/Splash.imageset

          if [ -d "$ICONS_SRC" ]; then
            cp -r $ICONS_SRC/. $ICONS_DEST/
            echo "✅ App icons injected"
          else
            echo "⚠️ No ios-assets/AppIcons folder found, skipping"
          fi

          if [ -f "$SPLASH_SRC" ]; then
            mkdir -p $SPLASH_DEST_DIR
            cp $SPLASH_SRC $SPLASH_DEST_DIR/splash.png
            cat > $SPLASH_DEST_DIR/Contents.json << JSON
          {
            "images": [
              { "idiom": "universal", "filename": "splash.png", "scale": "1x" },
              { "idiom": "universal", "filename": "splash.png", "scale": "2x" },
              { "idiom": "universal", "filename": "splash.png", "scale": "3x" }
            ],
            "info": { "version": 1, "author": "xcode" }
          }
          JSON
            echo "✅ Splash screen injected"
          else
            echo "⚠️ No ios-assets/SplashScreen/splash.png found, skipping"
          fi

      - name: Set version and build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          agvtool new-marketing-version $APP_VERSION
          agvtool new-version -all $BUILD_NUMBER
          echo "✅ Version: $APP_VERSION ($BUILD_NUMBER)"

      - name: Set up keychain and signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Create export options plist
        script: |
          cat > /Users/builder/export_options.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>46W6UT654D</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.loggerheadstat.app</key>
              <string>Loggerhead App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Build and archive iOS app
        script: |
          cd $CM_BUILD_DIR/ios/App
          # Signing goes on the App target only. Passing it on the xcodebuild command line applies
          # it to every target, and the Swift package bundles Firebase brings in (FirebaseCore,
          # GoogleUtilities, nanopb, ...) fail with "does not support provisioning profiles".
          gem list -i xcodeproj >/dev/null 2>&1 || gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open(ARGV[0])
            app = proj.targets.find { |t| t.name == "App" } or abort("App target not found")
            app.build_configurations.each do |c|
              next unless c.name == "Release"
              s = c.build_settings
              s["CODE_SIGN_STYLE"] = "Manual"
              s["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              s["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
              s["DEVELOPMENT_TEAM"] = "46W6UT654D"
              s["PRODUCT_BUNDLE_IDENTIFIER"] = "com.loggerheadstat.app"
              s["PROVISIONING_PROFILE_SPECIFIER"] = "Loggerhead App Store"
            end
            proj.save
            puts "✅ App target signing set (Release)"
          ' "$XCODE_PROJECT"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            MARKETING_VERSION=$APP_VERSION \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/ios/ipa

    artifacts:
      - $CM_BUILD_DIR/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Family"

  loggerhead-android:
    name: Loggerhead Android - Play Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: android-release
          include: true

    environment:
      android_signing:
        - loggerhead_keystore
      vars:
        PACKAGE_NAME: "com.loggerheadstat.app"
        REACT_APP_API_URL: "https://api.loggerhead.app"
        APP_VERSION: "2.1.3"
      node: v22.0.0
      java: 21

    scripts:
      - name: Install npm dependencies
        script: |
          cd $CM_BUILD_DIR
          npm install

      - name: Build React app
        script: |
          cd $CM_BUILD_DIR
          REACT_APP_API_URL=$REACT_APP_API_URL npm run build

      - name: Add Android platform
        script: |
          cd $CM_BUILD_DIR
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Generate app icons and splash screen
        script: |
          # Sources live in assets/ (icon-only, icon-foreground/background, splash, splash-dark).
          # android/ is recreated every build, so the generated resources must be too.
          cd $CM_BUILD_DIR
          npx -y @capacitor/assets@3 generate --android
          echo "✅ Android icons and splash generated"

      - name: Enable push notifications (Android)
        script: |
          # android/ is recreated every build. Capacitor's template applies the Google
          # Services plugin automatically when app/google-services.json is present.
          cd $CM_BUILD_DIR
          if [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
            echo "✅ google-services.json added"
          else
            echo "❌ firebase/google-services.json is missing — add it before building (see firebase/README.md)"
            exit 1
          fi

          # White status-bar icon + brand color (Android tints notification icons).
          RES=android/app/src/main/res
          cp -R android-assets/notification-icon/. "$RES/"
          mkdir -p "$RES/values"
          cat > "$RES/values/push_colors.xml" << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="push_notification_color">#15803D</color>
          </resources>
          XML

          python3 - android/app/src/main/AndroidManifest.xml << 'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          if "default_notification_icon" not in src:
              meta = '''
                  <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_loggerhead" />
                  <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/push_notification_color" />
                  <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="default" />
              '''
              src = src.replace("</application>", meta + "</application>", 1)
              open(path, "w").write(src)
          PY
          grep -q default_notification_icon android/app/src/main/AndroidManifest.xml && echo "✅ Push notifications enabled (Android)"

      - name: Add Android permissions to AndroidManifest.xml
        script: |
          MANIFEST=$CM_BUILD_DIR/android/app/src/main/AndroidManifest.xml
          # RECORD_AUDIO for speech recognition
          grep -q 'RECORD_AUDIO' "$MANIFEST" || \
            sed -i 's|<uses-permission android:name="android.permission.INTERNET"|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET"|' "$MANIFEST"
          echo "✅ AndroidManifest permissions set"

      - name: Set version in build.gradle
        script: |
          # macOS (BSD) sed requires -i '' — use that form to be safe.
          # versionCode is also passed as a Gradle flag below as a belt-and-suspenders fix.
          GRADLE=$CM_BUILD_DIR/android/app/build.gradle
          sed -i '' "s/versionName \".*\"/versionName \"$APP_VERSION\"/" "$GRADLE"
          sed -i '' "s/versionCode .*/versionCode $BUILD_NUMBER/" "$GRADLE"
          echo "✅ Version: $APP_VERSION (versionCode $BUILD_NUMBER)"

      - name: Build release AAB
        script: |
          cd $CM_BUILD_DIR/android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD \
            -Pandroid.injected.version.code=$BUILD_NUMBER \
            -Pandroid.injected.version.name=$APP_VERSION

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/mapping/release/mapping.txt
      - /tmp/android-build-logs/*.log

    # publishing:           # Uncomment after first manual upload to Play Console
    #   google_play:        # and service account is configured in Codemagic env vars
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true