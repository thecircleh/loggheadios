workflows:
  loggerhead-ios:
    name: Loggerhead iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-capacitor
          include: true

    integrations:
      app_store_connect: Loggerhead ASC Key

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.loggerheadstat.app
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.loggerheadstat.app"
        REACT_APP_API_URL: "https://api.loggerhead.app"
        APP_VERSION: "1.1"
      node: v22.0.0

    scripts:
      - name: Install npm dependencies
        script: |
          cd $CM_BUILD_DIR
          npm install

      - name: Build React app
        script: |
          cd $CM_BUILD_DIR
          REACT_APP_API_URL=$REACT_APP_API_URL npm run build

      - name: Add iOS platform
        script: |
          cd $CM_BUILD_DIR
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Copy web assets to iOS
        script: |
          cd $CM_BUILD_DIR
          npx cap copy ios

      - name: Enable In-App Purchase capability
        script: |
          PROJ=$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj
          ENTITLEMENTS=$CM_BUILD_DIR/ios/App/App/App.entitlements

          # Create entitlements file if it doesn't exist
          if [ ! -f "$ENTITLEMENTS" ]; then
            /usr/libexec/PlistBuddy -c "Clear dict" "$ENTITLEMENTS"
            echo "✅ Created App.entitlements"
          fi

          # StoreKit (In-App Purchase) does not require a special entitlement key —
          # it is enabled automatically for App Store distribution profiles.
          # However we wire up the entitlements file so Xcode picks it up for dev signing.
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.in-app-payments array" "$ENTITLEMENTS" 2>/dev/null || true

          # Point the Xcode target at our entitlements file
          sed -i '' 's|CODE_SIGN_ENTITLEMENTS = .*|CODE_SIGN_ENTITLEMENTS = App/App.entitlements;|g' "$PROJ" 2>/dev/null || true

          echo "✅ In-App Purchase capability enabled"

      - name: Add iOS permissions to Info.plist
        script: |
          PLIST=$CM_BUILD_DIR/ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Loggerhead uses your microphone for voice-activated stat logging'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Loggerhead uses speech recognition to log volleyball stats hands-free'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || true
          echo "✅ iOS permissions added to Info.plist"

      - name: Inject app icons and splash screen
        script: |
          ICONS_SRC=$CM_BUILD_DIR/ios-assets/AppIcons
          ICONS_DEST=$CM_BUILD_DIR/ios/App/App/Assets.xcassets/AppIcon.appiconset
          SPLASH_SRC=$CM_BUILD_DIR/ios-assets/SplashScreen/splash.png
          SPLASH_DEST_DIR=$CM_BUILD_DIR/ios/App/App/Assets.xcassets/Splash.imageset

          if [ -d "$ICONS_SRC" ]; then
            cp -r $ICONS_SRC/. $ICONS_DEST/
            echo "✅ App icons injected"
          else
            echo "⚠️ No ios-assets/AppIcons folder found, skipping"
          fi

          if [ -f "$SPLASH_SRC" ]; then
            mkdir -p $SPLASH_DEST_DIR
            cp $SPLASH_SRC $SPLASH_DEST_DIR/splash.png
            cat > $SPLASH_DEST_DIR/Contents.json << JSON
          {
            "images": [
              { "idiom": "universal", "filename": "splash.png", "scale": "1x" },
              { "idiom": "universal", "filename": "splash.png", "scale": "2x" },
              { "idiom": "universal", "filename": "splash.png", "scale": "3x" }
            ],
            "info": { "version": 1, "author": "xcode" }
          }
          JSON
            echo "✅ Splash screen injected"
          else
            echo "⚠️ No ios-assets/SplashScreen/splash.png found, skipping"
          fi

      - name: Set version and build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          agvtool new-marketing-version $APP_VERSION
          agvtool new-version -all $BUILD_NUMBER
          echo "✅ Version: $APP_VERSION ($BUILD_NUMBER)"

      - name: Set up keychain and signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Create export options plist
        script: |
          cat > /Users/builder/export_options.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>46W6UT654D</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.loggerheadstat.app</key>
              <string>Loggerhead App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Build and archive iOS app
        script: |
          cd $CM_BUILD_DIR/ios/App
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=46W6UT654D \
            PRODUCT_BUNDLE_IDENTIFIER=com.loggerheadstat.app \
            PROVISIONING_PROFILE_SPECIFIER="Loggerhead App Store" \
            MARKETING_VERSION=$APP_VERSION \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/ios/ipa

    artifacts:
      - $CM_BUILD_DIR/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Family"

  loggerhead-android:
    name: Loggerhead Android - Play Store
    max_build_duration: 60
    instance_type: linux_x2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: android-release
          include: true

    environment:
      android_signing:
        - loggerhead_keystore
      vars:
        PACKAGE_NAME: "com.loggerheadstat.app"
        REACT_APP_API_URL: "https://api.loggerhead.app"
        APP_VERSION: "1.1"
      node: v22.0.0

    scripts:
      - name: Install npm dependencies
        script: |
          cd $CM_BUILD_DIR
          npm install

      - name: Build React app
        script: |
          cd $CM_BUILD_DIR
          REACT_APP_API_URL=$REACT_APP_API_URL npm run build

      - name: Add Android platform
        script: |
          cd $CM_BUILD_DIR
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Android permissions to AndroidManifest.xml
        script: |
          MANIFEST=$CM_BUILD_DIR/android/app/src/main/AndroidManifest.xml
          # RECORD_AUDIO for speech recognition
          grep -q 'RECORD_AUDIO' "$MANIFEST" || \
            sed -i 's|<uses-permission android:name="android.permission.INTERNET"|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET"|' "$MANIFEST"
          echo "✅ AndroidManifest permissions set"

      - name: Set version in build.gradle
        script: |
          GRADLE=$CM_BUILD_DIR/android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$APP_VERSION\"/" "$GRADLE"
          sed -i "s/versionCode .*/versionCode $BUILD_NUMBER/" "$GRADLE"
          echo "✅ Version: $APP_VERSION ($BUILD_NUMBER)"

      - name: Build release AAB
        script: |
          cd $CM_BUILD_DIR/android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - /tmp/android-build-logs/*.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true